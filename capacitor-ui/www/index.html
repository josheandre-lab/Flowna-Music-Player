<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Flowna Music Player</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F4F0;--surface:#FFFFFF;
  --p:#FF6B4A;--p2:#FF8A6E;--pu:#FFF0EC;
  --s:#1A1A2E;--s2:#252540;
  --g:#00C896;--gu:rgba(0,200,150,0.12);
  --t1:#1A1A2E;--t2:#6B7280;--t3:#A0ADB8;
  --bdr:rgba(26,26,46,0.07);
  --sh0:0 1px 3px rgba(26,26,46,.05);
  --sh1:0 2px 8px rgba(26,26,46,.07),0 1px 3px rgba(26,26,46,.04);
  --sh2:0 8px 24px rgba(26,26,46,.09),0 2px 8px rgba(26,26,46,.05);
  --sh3:0 20px 60px rgba(26,26,46,.14),0 4px 16px rgba(26,26,46,.08);
  --nav:70px;--mini:70px;
}
html,body{height:100%;overflow:hidden;background:#DEDAD5;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;align-items:center;justify-content:center}
#shell{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;
  border-radius:46px;
  box-shadow:0 40px 100px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.25),inset 0 1px 0 rgba(255,255,255,.6)}
@media(max-width:440px){
  body{background:var(--bg)}
  #shell{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  #app{display:block}
}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:opacity .26s,transform .26s;z-index:1}
.scr.off{opacity:0;pointer-events:none;transform:translateY(8px)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--mini) + var(--nav) + 20px);scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.shdr{padding:54px 24px 10px;position:sticky;top:0;z-index:5;background:var(--bg)}
.stitle{font-size:30px;font-weight:800;color:var(--t1);letter-spacing:-.8px;line-height:1.1}
.ssub{font-size:13px;color:var(--t2);margin-top:3px}
/* NAV */
#nav{position:absolute;bottom:0;left:0;right:0;height:var(--nav);
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--bdr);display:flex;align-items:center;padding:0 8px;
  z-index:50;box-shadow:0 -2px 20px rgba(26,26,46,.06)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:7px 4px;cursor:pointer;border-radius:14px;position:relative;
  transition:transform .15s;user-select:none}
.ni:active{transform:scale(.91)}
.npill{position:absolute;inset:3px 4px;background:var(--pu);border-radius:12px;z-index:-1;
  opacity:0;transform:scale(.8);transition:opacity .22s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.ni.on .npill{opacity:1;transform:scale(1)}
.nico{font-size:21px;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.ni.on .nico{transform:scale(1.15)}
.nlbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.5px;transition:color .2s}
.ni.on .nlbl{color:var(--p)}
/* MINI */
#mini{position:absolute;bottom:var(--nav);left:8px;right:8px;height:var(--mini);
  background:var(--s);border-radius:22px;display:flex;align-items:center;gap:12px;padding:0 14px;
  z-index:49;cursor:pointer;overflow:hidden;
  box-shadow:0 -2px 24px rgba(26,26,46,.18),0 10px 32px rgba(26,26,46,.24);transition:transform .18s}
#mini:active{transform:scale(.98)}
.mglow{position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,107,74,.18),transparent 50%);pointer-events:none}
.mcover{width:48px;height:48px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#ede0ff,#ffd6cc);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.32)}
.mcover img{width:100%;height:100%;object-fit:cover;display:block}
.minfo{flex:1;min-width:0}
.mtitle{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.martist{font-size:11px;color:rgba(255,255,255,.48);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprog{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.08)}
.mpfill{height:100%;background:var(--p);border-radius:1px;transition:width .35s ease}
.mctrls{display:flex;gap:3px;align-items:center;flex-shrink:0}
.mbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:rgba(255,255,255,.7);font-size:17px;
  transition:all .14s;border:none;background:transparent;font-family:inherit}
.mbtn:active{transform:scale(.84);background:rgba(255,255,255,.1)}
.mbtn.mplay{background:var(--p);color:#fff;font-size:16px;box-shadow:0 4px 12px rgba(255,107,74,.4)}
/* SEARCH */
.swrap{margin:0 24px 14px;position:relative}
.sinp{width:100%;padding:14px 46px;border-radius:999px;border:1.5px solid var(--bdr);
  background:var(--surface);font-size:15px;color:var(--t1);outline:none;font-family:inherit;
  box-shadow:var(--sh0);transition:border .2s,box-shadow .2s}
.sinp:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(255,107,74,.1)}
.sinp::placeholder{color:var(--t3)}
.sico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--t3);pointer-events:none}
.sclr{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;background:rgba(26,26,46,.08);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2);cursor:pointer}
.chips{display:flex;gap:8px;padding:0 24px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--bdr);
  font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0}
.chip:active,.chip.on{background:var(--pu);border-color:var(--p);color:var(--p)}
.stlbl{font-size:16px;font-weight:800;color:var(--t1);padding:0 24px 10px;letter-spacing:-.3px}
/* MUSIC CARD */
.mc{display:flex;align-items:center;gap:12px;padding:10px 24px;cursor:pointer;transition:background .15s}
.mc:active{background:rgba(26,26,46,.03)}
.mcimg{width:56px;height:56px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#ede0ff,#ffd6cc);
  display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;box-shadow:var(--sh0)}
.mcimg img{width:100%;height:100%;object-fit:cover;display:block}
.mci{flex:1;min-width:0}
.mct{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mca{font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcm{display:flex;align-items:center;gap:6px;margin-top:4px}
.bdg{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.byt{background:#FEECEB;color:#D93025}
.bloc{background:var(--gu);color:#009970}
.bdl{background:rgba(79,70,229,.1);color:#4F46E5}
.dur{font-size:11px;color:var(--t3)}
.mcact{display:flex;gap:4px;align-items:center;flex-shrink:0}
.cbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:15px;transition:all .14s;
  border:none;background:transparent;font-family:inherit}
.cbtn:active{transform:scale(.84)}
.cprev{background:var(--pu);color:var(--p)}
.cdl{background:var(--gu);color:var(--g)}
.cmore{color:var(--t3);font-size:20px}
/* PREVIEW */
#pov{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(20,20,36,.52);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  transition:opacity .26s}
#pov.off{opacity:0;pointer-events:none}
#pov.off .psheet{transform:translateY(100%)}
.psheet{background:var(--surface);border-radius:28px 28px 0 0;padding:20px 24px 40px;
  transition:transform .32s cubic-bezier(.32,.72,0,1)}
.phdl{width:38px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 20px}
.pcov{border-radius:18px;margin:0 auto 16px;background:linear-gradient(135deg,#ede0ff,#ffd6cc);
  display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--sh3)}
.pcov img{width:100%;height:100%;object-fit:cover;display:block}
.pt{font-size:19px;font-weight:800;text-align:center;color:var(--t1);letter-spacing:-.3px}
.par{font-size:13px;color:var(--t2);text-align:center;margin-top:4px}
.pbarw{margin:20px 0 6px}
.pbar{height:4px;border-radius:2px;background:var(--bdr);position:relative;cursor:pointer}
.pbf{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--p),var(--p2));position:relative;transition:width .18s linear}
.pbth{width:14px;height:14px;border-radius:50%;background:var(--p);position:absolute;right:-7px;top:-5px;box-shadow:0 2px 8px rgba(255,107,74,.45)}
.ptm{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:6px}
.pctrls2{display:flex;align-items:center;gap:12px;margin-top:16px}
.ppbtn{width:56px;height:56px;border-radius:50%;background:var(--p);display:flex;align-items:center;
  justify-content:center;font-size:21px;color:#fff;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,107,74,.4);transition:transform .14s;flex-shrink:0;border:none}
.ppbtn:active{transform:scale(.88)}
.pdlbtn{flex:1;padding:14px;border-radius:999px;background:var(--s);color:#fff;font-size:14px;
  font-weight:700;text-align:center;cursor:pointer;border:none;font-family:inherit;transition:all .14s}
.pdlbtn:active{transform:scale(.97)}
.pclbtn{width:100%;padding:12px;border-radius:999px;background:var(--bg);border:none;
  font-size:14px;color:var(--t2);font-family:inherit;cursor:pointer;margin-top:10px;font-weight:500}
/* LIBRARY */
.sumc{margin:0 24px 18px;background:linear-gradient(138deg,var(--s) 0%,#12122A 100%);
  border-radius:22px;padding:22px;color:#fff;position:relative;overflow:hidden}
.sumc::before{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,107,74,.12)}
.sumc::after{content:'♪';position:absolute;right:-4px;bottom:-20px;font-size:120px;opacity:.04;pointer-events:none;line-height:1}
.sumlbl{font-size:11px;color:rgba(255,255,255,.4);font-weight:800;letter-spacing:.8px}
.sumst{display:flex;gap:24px;margin-top:11px}
.sv{font-size:26px;font-weight:800;color:#fff}
.sl{font-size:11px;color:rgba(255,255,255,.42);margin-top:1px}
.su2{font-size:11px;color:rgba(255,255,255,.38);margin-top:8px}
.tabs{display:flex;gap:4px;padding:0 24px 14px}
.tbtn{flex:1;padding:10px;border-radius:14px;font-size:13px;font-weight:700;text-align:center;
  cursor:pointer;color:var(--t2);background:transparent;border:none;transition:all .2s;font-family:inherit}
.tbtn.on{background:var(--p);color:#fff;box-shadow:0 4px 16px rgba(255,107,74,.3)}
.hs{display:flex;gap:12px;padding:0 24px 4px;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.fc{flex-shrink:0;width:138px;cursor:pointer;transition:transform .15s}
.fc:active{transform:scale(.94)}
.fcov{width:138px;height:138px;border-radius:18px;background:linear-gradient(135deg,#ede0ff,#ffd6cc);
  display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;
  box-shadow:var(--sh2);margin-bottom:9px}
.fcov img{width:100%;height:100%;object-fit:cover;display:block}
.ft{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{font-size:11px;color:var(--t2);margin-top:1px}
/* DOWNLOADS */
.dlc{margin:0 24px 12px;background:var(--surface);border-radius:18px;padding:15px;box-shadow:var(--sh1)}
.dlct{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dlt{width:48px;height:48px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#ede0ff,#ffd6cc);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.dlt img{width:100%;height:100%;object-fit:cover;display:block}
.dli{flex:1;min-width:0}
.dlti{font-size:14px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlar{font-size:12px;color:var(--t2);margin-top:1px}
.dlm{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:6px}
.dltr{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.dlf{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:3px;transition:width .5s ease}
.dlb{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .14s}
.dlb:active{transform:scale(.94)}
.dlpause{background:var(--bg);color:var(--t2)}
.dlcancel{background:rgba(239,68,68,.08);color:#EF4444}
.dlretry{background:var(--pu);color:var(--p)}
.dlok{display:flex;align-items:center;gap:12px;padding:11px 24px}
.dlokico{width:36px;height:36px;border-radius:50%;background:var(--gu);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.dlfc{border-left:3px solid #EF4444}
.errb{font-size:12px;color:#EF4444;background:rgba(239,68,68,.06);border-radius:8px;padding:7px 10px;margin-bottom:9px}
/* SETTINGS */
.aicard{margin:0 24px 22px;background:linear-gradient(145deg,var(--s) 0%,#0E0E24 100%);
  border-radius:22px;padding:24px;text-align:center;position:relative;overflow:hidden}
.aicard::before{content:'';position:absolute;top:-44px;right:-44px;width:120px;height:120px;border-radius:50%;background:rgba(255,107,74,.13)}
.aicard::after{content:'';position:absolute;bottom:-24px;left:-20px;width:80px;height:80px;border-radius:50%;background:rgba(0,200,150,.07)}
.ailogo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--p2));
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;
  box-shadow:0 10px 28px rgba(255,107,74,.42)}
.ainame{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.2px}
.aiver{font-size:12px;color:rgba(255,255,255,.42);margin-top:3px}
.vbs{display:flex;gap:8px;justify-content:center;margin-top:12px}
.vb{padding:4px 11px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.4px}
.vok{background:rgba(0,200,150,.15);color:var(--g)}
.vgray{background:rgba(255,255,255,.09);color:rgba(255,255,255,.52)}
.ss{margin-bottom:6px}
.ssl{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:1.3px;text-transform:uppercase;padding:0 24px 8px}
.sg{margin:0 24px;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--sh1)}
.sr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s;position:relative}
.sr::after{content:'';position:absolute;bottom:0;left:52px;right:0;height:1px;background:var(--bdr)}
.sr:last-child::after{display:none}
.sr:active{background:rgba(26,26,46,.03)}
.srico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sri{flex:1;min-width:0}
.srt{font-size:14px;font-weight:500;color:var(--t1)}
.srs{font-size:12px;color:var(--t2);margin-top:1px}
.srr{color:var(--t3);font-size:16px}
.tog{width:46px;height:27px;border-radius:999px;background:rgba(26,26,46,.12);
  position:relative;cursor:pointer;transition:background .22s;flex-shrink:0}
.tog.on{background:var(--g)}
.togth{width:23px;height:23px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;
  box-shadow:0 2px 7px rgba(0,0,0,.18);transition:left .22s cubic-bezier(.34,1.4,.64,1)}
.tog.on .togth{left:21px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.sb{flex:1;padding:6px 7px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;
  cursor:pointer;color:var(--t2);transition:all .18s;border:none;background:transparent;font-family:inherit}
.sb.on{background:var(--surface);color:var(--t1);box-shadow:var(--sh0)}
.ir{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.irl{font-size:13px;color:var(--t2)}
.irv{font-size:13px;font-weight:700;color:var(--t1)}
.dr{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.dr::after{content:'';position:absolute;bottom:0;left:36px;right:0;height:1px;background:var(--bdr)}
.dr:last-child::after{display:none}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dok{background:var(--g)}.dwn{background:#F59E0B}
/* FULL PLAYER */
#player{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;
  transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .38s}
#player.off{transform:translateY(100%);opacity:0;pointer-events:none}
.plbg{position:absolute;inset:0;background:var(--s);overflow:hidden}
.plbga{position:absolute;inset:-60px;filter:blur(80px) saturate(1.8);opacity:.5;transform:scale(1.4)}
.plbga img{width:100%;height:100%;object-fit:cover;display:block}
.plbgov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,36,.25) 0%,rgba(18,18,36,.92) 100%)}
.plcon{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:0 28px 28px}
.plhdr{display:flex;align-items:center;justify-content:space-between;padding-top:54px;margin-bottom:2px}
.plhdrt{font-size:11px;font-weight:800;color:rgba(255,255,255,.38);letter-spacing:2px;text-transform:uppercase;flex:1;text-align:center}
.plbtn2{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.09);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,.65);
  cursor:pointer;border:none;transition:background .15s;font-family:inherit}
.plbtn2:active{background:rgba(255,255,255,.18)}
.plaw{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:8px 0}
.plart{width:274px;height:274px;border-radius:26px;background:linear-gradient(135deg,#ede0ff,#ffd6cc);
  display:flex;align-items:center;justify-content:center;font-size:96px;overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  animation:afloat 4s ease-in-out infinite}
.plart img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes afloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* SPECTRUM */
.spec{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:16px;justify-content:center}
.sb2{width:3px;border-radius:2px;background:rgba(255,255,255,.25);min-height:3px;transition:height .15s}
.sb2.pl{animation:specA var(--d) ease-in-out infinite alternate}
@keyframes specA{0%{height:3px}100%{height:var(--h)}}
.plrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.plsn{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plar{font-size:14px;color:rgba(255,255,255,.52);margin-top:3px}
.plfav{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:23px;cursor:pointer;transition:transform .18s;border:none;background:transparent;flex-shrink:0}
.plfav:active{transform:scale(.74)}
.plprog{margin-bottom:20px}
.plpb{height:4px;border-radius:2px;background:rgba(255,255,255,.13);position:relative;cursor:pointer}
.plpbf{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--p),var(--p2));position:relative;transition:width .22s ease}
.plpbt{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;right:-7px;top:-5px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pltime{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.36);margin-top:8px}
.placts{display:flex;gap:10px;margin-bottom:20px}
.plact{flex:1;padding:10px;border-radius:14px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;
  color:rgba(255,255,255,.52);cursor:pointer;transition:background .15s;border:none;font-family:inherit}
.plact:active{background:rgba(255,255,255,.16)}
.plctrls{display:flex;align-items:center;justify-content:space-between}
.cc{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:rgba(255,255,255,.62);cursor:pointer;transition:all .15s;
  border:none;background:transparent;position:relative;font-family:inherit;flex-direction:column}
.cc:active{transform:scale(.84);color:#fff}
.ccpn{color:rgba(255,255,255,.82);font-size:26px}
.ccskipn{font-size:9px;font-weight:800;color:rgba(255,255,255,.55);margin-top:-1px}
.ccplay{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;font-size:26px;color:var(--s);cursor:pointer;border:none;font-family:inherit;
  box-shadow:0 10px 34px rgba(255,255,255,.18);transition:transform .14s}
.ccplay:active{transform:scale(.9)}
/* TOAST */
#toast{position:absolute;bottom:calc(var(--mini) + var(--nav) + 14px);left:20px;right:20px;
  background:var(--s);color:#fff;border-radius:16px;padding:12px 16px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:9px;z-index:300;box-shadow:var(--sh3);
  transition:opacity .26s,transform .26s}
#toast.off{opacity:0;pointer-events:none;transform:translateY(16px)}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 32px;text-align:center}
.eico{font-size:48px;margin-bottom:14px;opacity:.32}
.et{font-size:16px;font-weight:800;color:var(--t2)}
.es{font-size:13px;color:var(--t3);margin-top:5px;line-height:1.6}
/* ANIMS */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.au{animation:fadeUp .32s cubic-bezier(.4,0,.2,1) both}
@keyframes sdot{0%{transform:translateY(0);opacity:.4}100%{transform:translateY(-7px);opacity:1}}
.sldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p);margin:0 2px;animation:sdot .8s ease-in-out infinite alternate}
.sldot:nth-child(2){animation-delay:.2s}
.sldot:nth-child(3){animation-delay:.4s}
</style>
</head>
<body>
<div id="app"><div id="shell">
  <div class="scr" id="scr-search"></div>
  <div class="scr off" id="scr-library"></div>
  <div class="scr off" id="scr-downloads"></div>
  <div class="scr off" id="scr-settings"></div>
  <div id="mini" onclick="openPlayer()"></div>
  <nav id="nav"></nav>
  <div id="player" class="off"></div>
  <div id="pov" class="off" onclick="closePrev()"></div>
  <div id="toast" class="off"></div>
</div></div>
<script src="app.js"></script>
<script type="application/x-flowna-static-disabled">
// DATA
const C=['https://picsum.photos/seed/fl11/400/400','https://picsum.photos/seed/fl22/400/400','https://picsum.photos/seed/fl33/400/400','https://picsum.photos/seed/fl44/400/400','https://picsum.photos/seed/fl55/400/400','https://picsum.photos/seed/fl66/400/400','https://picsum.photos/seed/fl77/400/400','https://picsum.photos/seed/fl88/400/400'];
const SONGS=[
  {id:1,title:'Gece Yarısı Senfoni',artist:'Asya Kara',dur:'3:42',secs:222,cover:C[0],badge:'yt',dl:true,plays:1280},
  {id:2,title:'Derin Su',artist:'Mavi Ekip',dur:'4:15',secs:255,cover:C[1],badge:'yt',dl:true,plays:970},
  {id:3,title:'Şehir Işıkları',artist:'Neon Rüzgar',dur:'3:28',secs:208,cover:C[2],badge:'local',dl:false,plays:2040},
  {id:4,title:'Sabah Yağmuru',artist:'Elif Deniz',dur:'5:01',secs:301,cover:C[3],badge:'yt',dl:true,plays:560},
  {id:5,title:'Kızıl Orman',artist:'Terra Nova',dur:'3:55',secs:235,cover:C[4],badge:'local',dl:false,plays:3110},
  {id:6,title:'Ay Sesi',artist:'Luna Proje',dur:'4:22',secs:262,cover:C[5],badge:'yt',dl:true,plays:880},
  {id:7,title:'Rüzgar Çiçeği',artist:'Esra Yıldız',dur:'3:10',secs:190,cover:C[6],badge:'local',dl:true,plays:1760},
  {id:8,title:'Dijital Vaadi',artist:'SynthWave TR',dur:'4:48',secs:288,cover:C[7],badge:'yt',dl:false,plays:1430},
];
const RESULTS=[
  {id:9,title:'Peri Pembesi',artist:'Pembe Ay',dur:'3:18',secs:198,cover:C[0],badge:'yt'},
  {id:10,title:'Sonsuz Yaz',artist:'Güneş Kolektif',dur:'4:02',secs:242,cover:C[1],badge:'yt'},
  {id:11,title:'Kayalık Çağrı',artist:'Dağ Sesi',dur:'3:35',secs:215,cover:C[2],badge:'yt'},
  {id:12,title:'Elektronik Gece',artist:'Byte Dalgası',dur:'5:22',secs:322,cover:C[3],badge:'yt'},
  {id:13,title:'Yağmur Dansı',artist:'Aqua Müzik',dur:'3:48',secs:228,cover:C[4],badge:'yt'},
];
const ADL=[
  {id:'a1',title:'Neon Sabah',artist:'Kara Işık',cover:C[0],speed:'1.2 MB/s',size:'8.4 MB'},
  {id:'a2',title:'Yıldız Tozu',artist:'Galaktik Beat',cover:C[1],speed:'0.8 MB/s',size:'12.1 MB'},
];
const DDL=[
  {id:'d1',title:'Sabah Sisi',artist:'Mavi Çiçek',cover:C[2],size:'7.2 MB',date:'Bugün'},
  {id:'d2',title:'Gece Treni',artist:'Rails Sound',cover:C[3],size:'9.8 MB',date:'Dün'},
  {id:'d3',title:'Kumsal Ritmi',artist:'Okyanus',cover:C[4],size:'6.5 MB',date:'2 gün önce'},
];
const FDL=[{id:'f1',title:'Kayıp Melodi',artist:'Arşiv DJ',cover:C[5],err:'Bağlantı zaman aşımına uğradı'}];
const RECENT=['Sabah Müziği','Lo-fi','Türkçe Pop','Caz','Klasik Rock','Elektronik'];
const SPEC_H=[14,9,18,12,20,7,22,11,16,20,9,17,13,21,8,18];

// STATE
const st={
  screen:'search',song:SONGS[0],playing:false,prog:30,
  playerOpen:false,liked:false,
  prevSong:null,prevPl:false,prevProg:0,
  query:'',queryDone:false,
  libTab:'all',dlTab:'active',
  dlP:{a1:67,a2:23},
  quality:'320K',autoUp:true,bgDl:true,wifiOnly:false,
  toastTmr:null,progTmr:null,prevTmr:null,searchTmr:null,
};

// HELPERS
const $=id=>document.getElementById(id);
const fmt=s=>{const n=Math.floor(+s||0);return`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function imgD(src,w,h,r,fs){
  return`<div style="width:${w}px;height:${h}px;border-radius:${r}px;flex-shrink:0;background:linear-gradient(135deg,#ede0ff,#ffd6cc);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:${fs}px"><img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'" loading="lazy"></div>`;
}
function bdg(b){
  if(b==='yt') return'<span class="bdg byt">YouTube</span>';
  if(b==='local') return'<span class="bdg bloc">Yerel</span>';
  if(b==='dl') return'<span class="bdg bdl">💾 İndirildi</span>';
  return'';
}
function sJ(s){return esc(JSON.stringify(s))}
function toast(msg,d=2400){
  const t=$('toast');t.textContent=msg;t.classList.remove('off');
  clearTimeout(st.toastTmr);st.toastTmr=setTimeout(()=>t.classList.add('off'),d);
}

// NAV
function renderNav(){
  $('nav').innerHTML=[
    {id:'search',ico:'🔍',lbl:'Ara'},
    {id:'downloads',ico:'⬇️',lbl:'İndirme'},
    {id:'library',ico:'🎵',lbl:'Kütüphane'},
    {id:'settings',ico:'⚙️',lbl:'Ayarlar'},
  ].map(it=>`<div class="ni ${st.screen===it.id?'on':''}" onclick="goScreen('${it.id}')">
    <div class="npill"></div><div class="nico">${it.ico}</div><div class="nlbl">${it.lbl}</div>
  </div>`).join('');
}
function goScreen(s){
  document.querySelectorAll('.scr').forEach(e=>e.classList.add('off'));
  $(`scr-${s}`).classList.remove('off');
  st.screen=s;st.playerOpen=false;$('player').classList.add('off');
  renderNav();render(s);
}

// MINI PLAYER
function renderMini(){
  const s=st.song;
  if(!s){$('mini').style.display='none';return;}
  $('mini').style.display='flex';
  $('mini').innerHTML=`<div class="mglow"></div>
    <div class="mcover">${imgD(s.cover,48,48,12,22)}</div>
    <div class="minfo"><div class="mtitle">${esc(s.title)}</div><div class="martist">${esc(s.artist)}</div></div>
    <div class="mctrls" onclick="event.stopPropagation()">
      <button class="mbtn mplay" onclick="togglePlay()">${st.playing?'⏸':'▶'}</button>
      <button class="mbtn" onclick="nextSong()">⏭</button>
    </div>
    <div class="mprog"><div class="mpfill" id="mpfill" style="width:${st.prog}%"></div></div>`;
}

// PLAYBACK
function togglePlay(){
  st.playing=!st.playing;
  renderMini();updatePlayerBtn();updateSpec();
  st.playing?startProg():stopProg();
}
function startProg(){
  stopProg();
  st.progTmr=setInterval(()=>{
    st.prog=st.prog>=100?0:st.prog+0.12;
    const f=$('mpfill');if(f)f.style.width=st.prog+'%';
    const pf=document.querySelector('.plpbf');if(pf)pf.style.width=st.prog+'%';
    const t=document.querySelector('.pltime span');if(t)t.textContent=fmt(st.prog/100*(st.song?.secs||222));
  },200);
}
function stopProg(){clearInterval(st.progTmr);}
function playSong(json){
  const s=typeof json==='string'?JSON.parse(json):json;
  st.song=s;st.playing=true;st.prog=0;st.liked=false;
  renderMini();renderPlayer();$('player').classList.remove('off');
  st.playerOpen=true;startProg();
  toast('▶ '+s.title+' çalıyor');
}
function nextSong(){
  const i=SONGS.findIndex(s=>s.id===st.song?.id);
  playSong(SONGS[(i+1)%SONGS.length]);
}
function prevSong(){
  const i=SONGS.findIndex(s=>s.id===st.song?.id);
  playSong(SONGS[(i-1+SONGS.length)%SONGS.length]);
}
function seekPlayer(e){
  const r=e.currentTarget.getBoundingClientRect();
  st.prog=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));
  const pf=document.querySelector('.plpbf');if(pf)pf.style.width=st.prog+'%';
  const t=document.querySelector('.pltime span');if(t)t.textContent=fmt(st.prog/100*(st.song?.secs||222));
}
function updatePlayerBtn(){const b=document.querySelector('.ccplay');if(b)b.textContent=st.playing?'⏸':'▶';}
function updateSpec(){
  const sp=document.querySelector('.spec');
  if(sp)sp.innerHTML=SPEC_H.map((h,i)=>`<div class="sb2 ${st.playing?'pl':''}" style="height:${st.playing?h:3}px;--h:${h}px;--d:${(.38+(i%6)*.09).toFixed(2)}s"></div>`).join('');
}

// FULL PLAYER
function specHTML(){return SPEC_H.map((h,i)=>`<div class="sb2 ${st.playing?'pl':''}" style="height:${st.playing?h:3}px;--h:${h}px;--d:${(.38+(i%6)*.09).toFixed(2)}s"></div>`).join('');}
function toggleLike(){
  st.liked=!st.liked;
  const b=document.querySelector('.plfav');if(b)b.textContent=st.liked?'❤️':'🤍';
  toast(st.liked?'❤️ Favorilere eklendi':'🤍 Favorilerden çıkarıldı');
}
function openPlayer(){st.playerOpen=true;renderPlayer();$('player').classList.remove('off');}
function closePlayer(){st.playerOpen=false;$('player').classList.add('off');}
function renderPlayer(){
  const s=st.song;if(!s)return;
  $('player').innerHTML=`
    <div class="plbg">
      <div class="plbga">${imgD(s.cover,400,400,0,0)}</div>
      <div class="plbgov"></div>
    </div>
    <div class="plcon">
      <div class="plhdr">
        <button class="plbtn2" onclick="closePlayer()">⌄</button>
        <div class="plhdrt">Şimdi Çalıyor</div>
        <button class="plbtn2">⋯</button>
      </div>
      <div class="plaw">
        <div class="plart">${imgD(s.cover,274,274,26,96)}</div>
        <div class="spec">${specHTML()}</div>
      </div>
      <div class="plrow">
        <div style="flex:1;min-width:0">
          <div class="plsn">${esc(s.title)}</div>
          <div class="plar">${esc(s.artist)}</div>
        </div>
        <button class="plfav" onclick="toggleLike()">${st.liked?'❤️':'🤍'}</button>
      </div>
      <div class="plprog">
        <div class="plpb" onclick="seekPlayer(event)">
          <div class="plpbf" style="width:${st.prog}%"><div class="plpbt"></div></div>
        </div>
        <div class="pltime"><span>${fmt(st.prog/100*s.secs)}</span><span>${s.dur}</span></div>
      </div>
      <div class="placts">
        <button class="plact" onclick="toast('➕ Sıraya eklendi')">➕ Sıraya Ekle</button>
        <button class="plact" onclick="toast('↗️ Link kopyalandı')">↗️ Paylaş</button>
      </div>
      <div class="plctrls">
        <button class="cc ccpn" onclick="prevSong()">⏮</button>
        <button class="cc" onclick="toast('10 saniye geri alındı')">
          <span style="font-size:22px">↺</span><span class="ccskipn">10</span>
        </button>
        <button class="ccplay" onclick="togglePlay()">${st.playing?'⏸':'▶'}</button>
        <button class="cc" onclick="toast('10 saniye ileri alındı')">
          <span style="font-size:22px">↻</span><span class="ccskipn">10</span>
        </button>
        <button class="cc ccpn" onclick="nextSong()">⏭</button>
      </div>
    </div>`;
}

// PREVIEW
function openPrev(json){
  const s=typeof json==='string'?JSON.parse(json):json;
  st.prevSong=s;st.prevPl=true;st.prevProg=0;
  renderPrev();$('pov').classList.remove('off');startPrevProg();
}
function closePrev(){$('pov').classList.add('off');stopPrevProg();st.prevSong=null;st.prevPl=false;st.prevProg=0;}
function stopPrevProg(){clearInterval(st.prevTmr);}
function startPrevProg(){
  stopPrevProg();
  st.prevTmr=setInterval(()=>{
    if(!st.prevPl)return;
    st.prevProg=st.prevProg>=100?0:st.prevProg+0.6;
    const f=$('pov').querySelector('.pbf');if(f)f.style.width=st.prevProg+'%';
    const t=$('pov').querySelector('.ptm span');if(t)t.textContent=fmt(st.prevProg/100*30);
  },180);
}
function togglePrevPlay(){
  st.prevPl=!st.prevPl;
  const b=$('pov').querySelector('.ppbtn');if(b)b.textContent=st.prevPl?'⏸':'▶';
  st.prevPl?startPrevProg():stopPrevProg();
}
function renderPrev(){
  const s=st.prevSong;if(!s)return;
  $('pov').innerHTML=`<div class="psheet" onclick="event.stopPropagation()">
    <div class="phdl"></div>
    <div class="pcov" style="width:116px;height:116px;margin:0 auto 16px">${imgD(s.cover,116,116,18,46)}</div>
    <div class="pt">${esc(s.title)}</div>
    <div class="par">${esc(s.artist)}</div>
    <div class="pbarw">
      <div class="pbar">
        <div class="pbf" style="width:${st.prevProg}%"><div class="pbth"></div></div>
      </div>
      <div class="ptm"><span>${fmt(0)}</span><span>0:30 önizleme</span></div>
    </div>
    <div class="pctrls2">
      <button class="ppbtn" onclick="togglePrevPlay()">${st.prevPl?'⏸':'▶'}</button>
      <button class="pdlbtn" onclick="toast('⬇️ İndirme başladı');closePrev()">⬇ İndir</button>
    </div>
    <button class="pclbtn" onclick="closePrev()">Kapat</button>
  </div>`;
}

// SCREEN: SEARCH
let sTmr;
function onSearch(v){st.query=v;st.queryDone=false;renderSearch();clearTimeout(sTmr);if(v.length>1)sTmr=setTimeout(()=>{st.queryDone=true;renderSearch();},620);}
function clearSearch(){st.query='';st.queryDone=false;renderSearch();}
function mcHTML(s,i,delay){
  const j=sJ(s);
  return`<div class="mc au" style="animation-delay:${(i*.055+(delay||0)).toFixed(2)}s" onclick='playSong("${j}")'>
    <div class="mcimg">${imgD(s.cover,56,56,12,24)}</div>
    <div class="mci">
      <div class="mct">${esc(s.title)}</div>
      <div class="mca">${esc(s.artist)}</div>
      <div class="mcm">${bdg(s.badge)}<span class="dur">${s.dur}</span></div>
    </div>
    <div class="mcact" onclick="event.stopPropagation()">
      <button class="cbtn cprev" onclick='openPrev("${j}")' title="Önizle">▶</button>
      <button class="cbtn cdl" onclick="toast('⬇️ İndirme başladı')" title="İndir">⬇</button>
    </div>
  </div>`;
}
function renderSearch(){
  const el=$('scr-search'),q=st.query,loading=q.length>1&&!st.queryDone;
  const songs=q.length>1?RESULTS:SONGS.slice(0,5);
  el.innerHTML=`<div class="shdr">
    <div class="stitle">Ara</div>
    <div class="ssub">Şarkı, sanatçı veya albüm keşfet.</div>
  </div>
  <div class="scroll">
    <div class="swrap">
      <div class="sico">🔍</div>
      <input class="sinp" id="sinp" placeholder="Şarkı, sanatçı, albüm..." value="${esc(q)}" oninput="onSearch(this.value)" autocomplete="off">
      ${q?'<div class="sclr" onclick="clearSearch()">✕</div>':''}
    </div>
    ${!q?`<div class="stlbl">Son Aramalar</div>
    <div class="chips">${RECENT.map(r=>`<div class="chip" onclick="onSearch('${esc(r)}')">${r}</div>`).join('')}</div>
    <div class="stlbl">Öne Çıkanlar</div>`:
    loading?`<div class="empty" style="padding:40px 32px">
      <div style="font-size:26px;margin-bottom:14px">
        <span class="sldot"></span><span class="sldot"></span><span class="sldot"></span>
      </div>
      <div class="et">Aranıyor...</div>
      <div class="es">"${esc(q)}" için sonuçlar yükleniyor</div>
    </div>`:
    `<div class="stlbl">${RESULTS.length} sonuç bulundu</div>`}
    ${!loading?songs.map((s,i)=>mcHTML(s,i)).join(''):''}
  </div>`;
}

// SCREEN: LIBRARY
function setLibTab(t){st.libTab=t;renderLibrary();}
function renderLibrary(){
  const el=$('scr-library'),tab=st.libTab;
  const songs=tab==='all'?SONGS:SONGS.filter(s=>s.dl);
  const tops=[...SONGS].sort((a,b)=>b.plays-a.plays).slice(0,5);
  el.innerHTML=`<div class="shdr">
    <div class="stitle">Kütüphane</div>
    <div class="ssub">${SONGS.length} şarkı koleksiyonunda</div>
  </div>
  <div class="scroll">
    <div class="sumc au">
      <div class="sumlbl">GENEL BAKIŞ</div>
      <div class="sumst">
        <div><div class="sv">${SONGS.length}</div><div class="sl">Tüm Şarkılar</div></div>
        <div><div class="sv">${SONGS.filter(s=>s.dl).length}</div><div class="sl">İndirilenler</div></div>
        <div><div class="sv">3</div><div class="sl">Liste</div></div>
      </div>
      <div class="su2">Son tarama: 2 dakika önce</div>
    </div>
    <div class="tabs">
      <button class="tbtn ${tab==='all'?'on':''}" onclick="setLibTab('all')">Tüm Şarkılar</button>
      <button class="tbtn ${tab==='dl'?'on':''}" onclick="setLibTab('dl')">İndirilenler</button>
    </div>
    ${tab==='all'?`
    <div class="stlbl">Senin için öneriler</div>
    <div class="hs" style="margin-bottom:22px">
      ${SONGS.slice(0,5).map((s,i)=>`<div class="fc" onclick='playSong("${sJ(s)}")'>
        <div class="fcov">${imgD(s.cover,138,138,18,48)}</div>
        <div class="ft">${esc(s.title)}</div><div class="fa">${esc(s.artist)}</div>
      </div>`).join('')}
    </div>
    <div class="stlbl">En çok dinlenenler</div>
    <div class="hs" style="margin-bottom:22px">
      ${tops.map((s,i)=>`<div class="fc" onclick='playSong("${sJ(s)}")'>
        <div style="position:relative">
          <div class="fcov">${imgD(s.cover,138,138,18,48)}</div>
          <div style="position:absolute;top:8px;left:8px;width:23px;height:23px;border-radius:7px;background:rgba(18,18,36,.75);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)">${i+1}</div>
        </div>
        <div class="ft">${esc(s.title)}</div>
        <div class="fa" style="color:var(--p)">${s.plays.toLocaleString('tr')} ♪</div>
      </div>`).join('')}
    </div>`:''}
    <div class="stlbl">Liste</div>
